name: Steam売れ筋ランキング チェック

on:
  schedule:
    # 毎時00分（UTC）に実行
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '強制通知する（テスト用）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: ランキングチェックを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STEAM_REGION: JP
          TOP_N: "50"
        run: |
          if [ "${{ github.event.inputs.force_notify }}" = "true" ]; then
            python main.py run --force-notify
          else
            python main.py run
          fi

      - name: ランキングデータをコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_ranking.json
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: ランキングデータ更新 [skip ci]"
            git push
          fi
